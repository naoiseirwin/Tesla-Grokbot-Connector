title = "tesla-grokbot-connector"

[extend]
useDefault = true

# Match the placeholder strings themselves. Do not allowlist whole paths:
# a real secret in .env.example, the callback page, or the changelog must fail CI.
[allowlist]
description = "Placeholder strings from .env.example, not live credentials"
regexes = [
  '''your_client_id_here''',
  '''your_client_secret_here''',
  '''your_base64_token_key_here''',
]
