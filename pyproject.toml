[project]
name = "tesla-grokbot-connector"
version = "0.1.0"
description = "Read-only Tesla Fleet API MCP for Grok Bot. Runs on the user's computer. No vehicle commands."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=44.0.0",
    "fastmcp>=2.12.4",
    "httpx>=0.28.1",
    "python-dotenv>=1.1.1",
]

[project.urls]
Homepage = "https://github.com/naoiseirwin/Tesla-Grokbot-Connector"
Repository = "https://github.com/naoiseirwin/Tesla-Grokbot-Connector"

[project.scripts]
tesla-mcp = "tesla_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tesla_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "respx>=0.22.0",
    "ruff>=0.14.0",
    "pyright>=1.1.406",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["tesla_mcp"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
exclude = ["scripts"]
